<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Light Blue Gradient for crisp, simple academic look -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="lightGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <!-- Clean Transparent Background (No giant dark disk) for a classic simple layout -->
  <g transform="translate(0, 10)">
    <!-- Main Graduation Cap / Mortarboard Diamond -->
    <path d="M 256,80 L 460,180 L 256,280 L 52,180 Z" fill="url(#blueGradient)" />
    
    <!-- Bevel for Cap Diamond -->
    <path d="M 256,95 L 430,180 L 256,265 L 82,180 Z" fill="url(#lightGlow)" opacity="0.15" />

    <!-- Cap Skull Cap / Band base beneath -->
    <path d="M 160,215 L 160,285 C 160,335 203,355 256,355 C 309,355 352,335 352,285 L 352,215 Z" fill="url(#blueGradient)" opacity="0.9" />
    <path d="M 180,225 L 180,285 C 180,315 214,335 256,335 C 298,335 332,315 332,285 L 332,225" fill="#0284c7" opacity="0.3" />

    <!-- Sleek falling Tassel of the Cap -->
    <path d="M 256,180 L 370,230 L 370,330" fill="none" stroke="#0ea5e9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="370" cy="340" r="16" fill="#38bdf8" />

    <!-- Core Floating Star / Accent Spark representing Excellence -->
    <path d="M 256,140 Q 256,180 216,180 Q 256,180 256,220 Q 256,180 296,180 Q 256,180 256,140 Z" fill="#ffffff" />
  </g>
</svg>
